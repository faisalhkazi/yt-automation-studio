{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header">
            <h3>Create New Project</h3>
        </div>

        <div class="card-body">

            <form action="/wizard/create" method="post">

                <div class="mb-3">
                    <label>Title</label>
                    <input
                        class="form-control"
                        name="title"
                        required>
                </div>

                <div class="mb-3">
                    <label>Category</label>

                    <select
                        class="form-select"
                        name="category">

                        <option>History</option>
                        <option>Sports</option>
                        <option>Technology</option>
                        <option>Finance</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label>Script</label>

                    <textarea
                        class="form-control"
                        rows="12"
                        name="script"
                        required></textarea>

                </div>

                <button
                    class="btn btn-primary btn-lg">

                    Continue →

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
