<!DOCTYPE html>

<html>

<head>

<title>Project</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header">

<h2>{{ project.title }}</h2>

</div>

<div class="card-body">

<table class="table">

<tr>

<th>ID</th>

<td>{{ project.id }}</td>

</tr>

<tr>

<th>Category</th>

<td>{{ project.category }}</td>

</tr>

<tr>

<th>Status</th>

<td>

<span class="badge bg-success">

{{ project.status }}

</span>

</td>

<tr>

<th>Script</th>

<td>

<a
href="/script/{{ project.id }}"
class="btn btn-primary">

📄 View Script

</a>

</td>

</tr>

<tr>

<th>Audio File</th>

<td>

<audio controls style="width:350px">

    <source
        src="/{{ project.audio_file }}"
        type="audio/wav">

    Your browser does not support audio.

</audio>

<br><br>

<a
    href="/{{ project.audio_file }}"
    class="btn btn-success"
    download>

    ⬇ Download Audio

</a>

</td>

</tr>

</table>

<hr>

<a href="/" class="btn btn-secondary">

⬅ Dashboard

</a>

</div>

</div>

</div>

</body>

</html>
