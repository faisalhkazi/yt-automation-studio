<!DOCTYPE html>
<html>

<head>

    <title>YT Automation Studio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="text-center mb-5">

        <h1>🎬 YT Automation Studio</h1>

        <p class="text-muted">
            AI Powered YouTube Content Automation
        </p>

    </div>

    <div class="row">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header">

                    <h4>Create New Project</h4>

                </div>

                <div class="card-body">

                    <form action="/generate" method="post">

                        <div class="mb-3">

                            <label class="form-label">

                                Title

                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Category

                            </label>

                            <select
                                name="category"
                                class="form-select">

                                <option>History</option>
                                <option>Technology</option>
                                <option>Motivation</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Script

                            </label>

                            <textarea
                                name="script"
                                rows="10"
                                class="form-control"
                                required></textarea>

                        </div>

                        <button
                            class="btn btn-primary w-100">

                            🚀 Generate Project

                        </button>

                    </form>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header">

                    <h4>Recent Projects</h4>

                </div>

                <div class="card-body">

                    <table class="table table-hover">

                        <thead>

                        <tr>

                            <th>ID</th>
                            <th>Title</th>
                            <th>Status</th>
                            <th></th>

                        </tr>

                        </thead>

                        <tbody>

                        {% for project in projects %}

                        <tr>

                            <td>{{ project.id }}</td>

                            <td>{{ project.title }}</td>

                            <td>

                                <span class="badge bg-success">

                                    {{ project.status }}

                                </span>

                            </td>

                            <td>

                                <a
                                    href="/project/{{ project.id }}"
                                    class="btn btn-sm btn-outline-primary">

                                    Open

                                </a>

                            </td>

                        </tr>

                        {% endfor %}

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
