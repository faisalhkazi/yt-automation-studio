{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between mb-4">

    <div>

        <h1>

            Dashboard

        </h1>

        <p class="text-muted">

            Welcome back 👋

        </p>

    </div>

    <a
    href="/wizard"
    class="btn btn-primary">

        <i class="bi bi-plus-circle"></i>

        New Project

    </a>

</div>

<div class="card">

<div class="card-header">

Recent Projects

</div>

<div class="card-body">

<table class="table">

<thead>

<tr>

<th>ID</th>

<th>Project</th>

<th>Status</th>

<th></th>

</tr>

</thead>

<tbody>

{% for project in projects %}

<tr>

<td>

{{ project.id }}

</td>

<td>

<b>

{{ project.title }}

</b>

</td>

<td>

<span class="badge bg-success">

{{ project.status }}

</span>

</td>

<td>

<a
href="/project/{{project.id}}"
class="btn btn-primary btn-sm">

Open

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

{% endblock %}
