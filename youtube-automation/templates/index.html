<!DOCTYPE html>
<html>
<head>
    <title>YouTube Automation</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        button {
            background: #ff0000;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
        }

    </style>
</head>

<body>

<div class="container">

<h1>YouTube Automation</h1>

<form method="POST" action="/generate">

<label>Video Title</label>
<input type="text" name="title" required>

<label>Category</label>

<select name="category">

    <option>History</option>

    <option>Technology</option>

    <option>Motivation</option>

</select>

<label>Script</label>

<textarea rows="20" name="script" required></textarea>

<button type="submit">

Generate

</button>

</form>

<hr>

<h2>Recent Projects</h2>

<table border="1" cellpadding="8">

<tr>
    <th>ID</th>
    <th>Title</th>
    <th>Category</th>
    <th>Status</th>
    <th>Action</th>

</tr>

{% for project in projects %}

<tr>

    <td>{{ project.id }}</td>

    <td>{{ project.title }}</td>

    <td>{{ project.category }}</td>

    <td>{{ project.status }}</td>
	
    <td>
        <a href="/project/{{ project.id }}">
            Open
        </a>
    </td>
</tr>

{% endfor %}

</table>


</div>

</body>
</html>
